# SemanticFlow Default Enterprise Persona Lens Definitions
version: "1.0"
personas:
  # ==============================================================================
  # 10 CORE CANONICAL PERSONAS (DIMENSION B)
  # ==============================================================================
  data_analyst:
    persona_id: "data_analyst"
    role: "DATA_ANALYST"
    display_name: "Data Analyst"
    title: "Data Analyst & Self-Service Consumption Lens"
    summary_template: "Certified KPIs, domain dimensions, and self-service exploration catalog for {project_name}."
    technical_depth: "SUMMARY"
    focus_areas:
      - "CONSUMPTION_SIMPLICITY"
      - "BUSINESS_VALUE"
    visible_object_types:
      - "FACT"
      - "DIMENSION"
      - "KPI"
    icon: "bar-chart-2"
    color_theme: "#38A169"
    aliases:
      - "analyst"
      - "business_analyst"
      - "bi_analyst"

  analytics_engineer:
    persona_id: "analytics_engineer"
    role: "ANALYTICS_ENGINEER"
