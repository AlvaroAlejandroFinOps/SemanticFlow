[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticflow"
version = "0.1.0"
description = "Enterprise-grade declarative semantic model compiler and engineering platform"
authors = [{ name = "SemanticFlow Core Team" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "networkx>=3.0",
    "sqlglot>=20.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.scripts]
semanticflow = "src.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    ".git",
    "tests/Massive Stress Test",
    "tests/Massive Data Stress",
    "tests/Massive Data Stress v2",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = [
    "tests/Massive Stress Test",
    "tests/Massive Data Stress",
    "tests/Massive Data Stress v2",
]

[[tool.mypy.overrides]]
module = "networkx"
ignore_missing_imports = true



