    title: "Analytics Engineering, Dimensional Modeling & Transformation Lens"
    summary_template: "Star-schema topology, semantic metrics, SQL transformations, and grain definitions for {project_name}."
    technical_depth: "TECHNICAL"
    focus_areas:
      - "DATA_MODELING"
      - "MODELING_QUALITY"
    visible_object_types:
      - "FACT"
      - "DIMENSION"
      - "BRIDGE"
      - "CALCULATED"
    icon: "code"
    color_theme: "#319795"
    aliases:
      - "ae"
      - "dbt_developer"
      - "semantic_modeler"

  data_engineer:
    persona_id: "data_engineer"
